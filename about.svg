  <text x="420" y="26" text-anchor="middle" fill="#8f9cc4" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13">shehab@fdpm: ~/about</text>
  
  <text x="26" y="76" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#21EA9D">shehab</tspan><tspan fill="#8f9cc4">@</tspan><tspan fill="#4fd6e0">fdpm</tspan><tspan fill="#8f9cc4">:</tspan><tspan fill="#5a9dff">~</tspan><tspan fill="#8f9cc4">$ </tspan><tspan fill="#eaf1ff">shehab --how-i-work</tspan></text>
  <text x="26" y="101" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#4fd6e0">  the whole arc ..: </tspan><tspan fill="#eaf1ff">discovery, strategy, specs, delivery, the ugly trade-offs</tspan></text>
  <text x="26" y="126" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#4fd6e0">  ai-native ......: </tspan><tspan fill="#eaf1ff">LLMs inside the workflow, not bolted on for the demo</tspan></text>
  <text x="26" y="151" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#4fd6e0">  translator .....: </tspan><tspan fill="#eaf1ff">"the customer is annoyed" becomes a roadmap eng can ship</tspan></text>
  <text x="26" y="176" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#4fd6e0">  metrics-first ..: </tspan><tspan fill="#eaf1ff">activation, retention, revenue, the stuff that pays the bills</tspan></text>
  <text x="26" y="201" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#4fd6e0">  right now ......: </tspan><tspan fill="#eaf1ff">shipping 0 to 1, coaching PMs and founders, rewriting a PRD</tspan></text>
  
  <text x="26" y="251" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#21EA9D">shehab</tspan><tspan fill="#8f9cc4">@</tspan><tspan fill="#4fd6e0">fdpm</tspan><tspan fill="#8f9cc4">:</tspan><tspan fill="#5a9dff">~</tspan><tspan fill="#8f9cc4">$ </tspan><tspan fill="#eaf1ff">shehab --tldr</tspan></text>
  <text x="26" y="276" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#eaf1ff">  interim head of product </tspan><tspan fill="#8f9cc4">·</tspan><tspan fill="#eaf1ff"> growth consultant </tspan><tspan fill="#8f9cc4">·</tspan><tspan fill="#eaf1ff"> coach</tspan></text>
  <text x="26" y="301" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#ffd166">  15+ launches </tspan><tspan fill="#8f9cc4">·</tspan><tspan fill="#ffd166"> $4M+ generated </tspan><tspan fill="#8f9cc4">·</tspan><tspan fill="#ffd166"> 6M+ humans impacted</tspan></text>
  
