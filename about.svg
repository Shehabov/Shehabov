  <text x="420" y="26" text-anchor="middle" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13">shehab@fdpm: ~/about</text>
  
  <text x="26" y="76" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#3fb950">shehab</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#39c5cf">fdpm</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">shehab --how-i-work</tspan></text>
  <text x="26" y="101" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#39c5cf">  the whole arc ..: </tspan><tspan fill="#e6edf3">discovery, strategy, specs, delivery, the ugly trade-offs</tspan></text>
  <text x="26" y="126" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#39c5cf">  ai-native ......: </tspan><tspan fill="#e6edf3">LLMs inside the workflow, not bolted on for the demo</tspan></text>
  <text x="26" y="151" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#39c5cf">  translator .....: </tspan><tspan fill="#e6edf3">"the customer is annoyed" becomes a roadmap eng can ship</tspan></text>
  <text x="26" y="176" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#39c5cf">  metrics-first ..: </tspan><tspan fill="#e6edf3">activation, retention, revenue, the stuff that pays the bills</tspan></text>
  <text x="26" y="201" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#39c5cf">  right now ......: </tspan><tspan fill="#e6edf3">shipping 0 to 1, coaching PMs and founders, rewriting a PRD</tspan></text>
  
  <text x="26" y="251" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#3fb950">shehab</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#39c5cf">fdpm</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">shehab --tldr</tspan></text>
  <text x="26" y="276" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#e6edf3">  interim head of product </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3"> growth consultant </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3"> coach</tspan></text>
  <text x="26" y="301" font-family="ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#e3b341">  15+ launches </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e3b341"> $4M+ generated </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e3b341"> 6M+ humans impacted</tspan></text>
  
