name: Contribution snake

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/wrap_terminal.js"
      - "scripts/lib_term.js"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Shehabov
          outputs: |
            snake_raw.svg?color_snake=%2358a6ff&color_dots=%2321262d,%230e4429,%23006d32,%2326a641,%2339d353
      - name: Speed up + hide the stack bar, then wrap in terminal chrome
        run: |
          sed -i 's/[0-9]\+ms/5000ms/g; s/\.u{/.u{display:none;/g' snake_raw.svg
          node scripts/wrap_terminal.js snake_raw.svg snake.svg "shehab@fdpm: ~/contributions --snake"
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh contribution snake [skip ci]"
            git push
          fi
