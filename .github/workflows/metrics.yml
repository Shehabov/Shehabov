name: Metrics isocalendar

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/wrap_terminal.js"
      - "scripts/lib_term.js"

permissions:
  contents: write

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate isocalendar (raw)
        uses: lowlighter/metrics@latest
        with:
          user: Shehabov
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: isocalendar_raw.svg
          base: ""
          output_action: none
          config_timezone: Europe/Istanbul
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
      - name: Darken to match theme, then wrap in terminal chrome
        run: |
          sed -i 's/#ebedf0/#161b22/g; s/#0366d6/#58a6ff/g; s/color:#777/color:#8b949e/g; s/#24292e/#e6edf3/g' isocalendar_raw.svg
          node scripts/wrap_terminal.js isocalendar_raw.svg isocalendar.svg "shehab@fdpm: ~/contributions --calendar"
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isocalendar.svg
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh isocalendar [skip ci]"
            git push
          fi
