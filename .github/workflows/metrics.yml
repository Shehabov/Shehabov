name: Metrics isocalendar

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/wrap_terminal.js"
      - "scripts/lib_term.js"

permissions:
  contents: write

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate isocalendar (raw)
        uses: lowlighter/metrics@latest
        with:
          user: Shehabov
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: isocalendar_raw.svg
          base: ""
          output_action: none
          config_timezone: Europe/Istanbul
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
      - name: Darken to match theme, then wrap in terminal chrome
        run: |
          echo "metrics_renders:"; sudo ls -la /metrics_renders/ || true
          SRC=$(sudo ls /metrics_renders/*.svg | head -1)
          sudo cp "$SRC" ./isocalendar_raw.svg
          sudo chmod a+rw ./isocalendar_raw.svg
          sed -i 's/#ebedf0/#0a1f5e/g; s/#9be9a8/#7ff2cf/g; s/#40c463/#21EA9D/g; s/#30a14e/#16b87c/g; s/#216e39/#0f7d54/g; s/#0366d6/#5a9dff/g; s/color:#777/color:#8f9cc4/g; s/#24292e/#eaf1ff/g' isocalendar_raw.svg
          node scripts/wrap_terminal.js isocalendar_raw.svg isocalendar.svg "shehab@fdpm: ~/contributions --calendar"
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isocalendar.svg
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh isocalendar [skip ci]"
            git push
          fi
