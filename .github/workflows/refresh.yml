name: Refresh terminal + impact

on:
  schedule:
    - cron: "17 4 * * *"   # daily, re-stamps the terminal date
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-svgs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate SVGs
        run: |
          node scripts/gen_terminal.js
          node scripts/gen_stats.js
          node scripts/gen_languages.js
          node scripts/gen_about.js
          node scripts/gen_projects.js
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal.svg impact.svg languages.svg about.svg projects.svg
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh terminal + impact [skip ci]"
            git push
          fi
